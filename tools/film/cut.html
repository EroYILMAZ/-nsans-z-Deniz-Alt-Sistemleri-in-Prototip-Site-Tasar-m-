<!doctype html>
<meta charset="utf-8">
<title>cut</title>
<body style="margin:0;background:#333">
<script src="../../js/lib/three.min.js"></script>
<script src="../../js/auv/auv-model.js"></script>
<script>
// Renders transparent PNG cutouts of the model for the hero layers. Run window.cut() and it POSTs each PNG to /frame?i=N.
window.cut = async function () {
  var W = 2000, H = 1430;
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);
  var s = new THREE.Scene();
  (function env() {
    var e = new THREE.Scene();
    var sky = new THREE.ShaderMaterial({ side: THREE.BackSide,
      uniforms: { uTop: { value: new THREE.Color(0xc8f2ff) }, uMid: { value: new THREE.Color(0x12536d) }, uBot: { value: new THREE.Color(0x020a10) } },
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform vec3 uTop, uMid, uBot; varying vec3 vDir; void main(){ float y = vDir.y; vec3 c = y > 0.0 ? mix(uMid, uTop, pow(y, 0.9)) : mix(uMid, uBot, pow(-y, 0.45)); gl_FragColor = vec4(c, 1.0); }' });
    e.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), sky));
    function panel(w, h, c, x, y, z) { var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); e.add(m); }
    panel(6, 2.2, new THREE.Color(3.2, 3.6, 3.8), 0, 7, 2.5);
    panel(2.5, 5, new THREE.Color(1.3, 2.4, 2.6), -7, 2.5, -1);
    panel(2.2, 4, new THREE.Color(2.4, 1.5, 0.8), 7, 0.5, -3);
    var pm = new THREE.PMREMGenerator(renderer); s.environment = pm.fromScene(e, 0.035).texture;
  })();
  s.add(new THREE.HemisphereLight(0xbdf3ff, 0x06202e, 0.9));
  var key = new THREE.DirectionalLight(0xeaf8ff, 2.6); key.position.set(2, 4, 3); s.add(key);
  var rim = new THREE.DirectionalLight(0x34e7d4, 2.4); rim.position.set(-3, 1, -3); s.add(rim);
  var kick = new THREE.DirectionalLight(0xff9a4a, 0.5); kick.position.set(3, -1, -2); s.add(kick);
  var auv = D6AUV.build(THREE, { anisotropy: 8 });
  var g = new THREE.Group(); g.add(auv.root); s.add(g);
  var cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 50);
  var shots = [
    // i, explode, rotY, rotX, rotZ, camPos
    [1, 0, 0.75, 0.18, -0.12, [0, 0.55, 2.6]],   // 3/4 front, nose right, diving
    [2, 0.85, -0.9, 0.2, 0.1, [0, 0.6, 3.4]],     // exploded, nose left
    [3, 0, 2.4, -0.35, 0.05, [0, -0.2, 2.8]]      // from below, rear 3/4
  ];
  for (var k = 0; k < shots.length; k++) {
    var sh = shots[k];
    auv.explode(sh[1]);
    g.rotation.set(sh[3], sh[2], sh[4]);
    cam.position.fromArray(sh[5]); cam.lookAt(0, 0, 0);
    renderer.render(s, cam);
    var src = renderer.domElement, c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
    var x2 = c2.getContext('2d'); x2.drawImage(src, 0, 0);
    var d = x2.getImageData(0, 0, W, H).data, x0 = W, y0 = H, x1 = 0, y1 = 0;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    x0 = Math.max(0, x0 - 8); y0 = Math.max(0, y0 - 8); var cw = Math.min(W, x1 + 9) - x0, ch = Math.min(H, y1 + 9) - y0;
    var sc = Math.min(1, 1100 / cw), out = document.createElement('canvas'); out.width = Math.round(cw * sc); out.height = Math.round(ch * sc);
    out.getContext('2d').drawImage(c2, x0, y0, cw, ch, 0, 0, out.width, out.height);
    var blob = await new Promise(function (r) { out.toBlob(r, 'image/webp', 0.86); });
    await fetch('/frame?i=' + sh[0], { method: 'POST', body: blob });
  }
  return 'ok';
};
</script>
